<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREZSD UP | Batch 001</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --accent:#00f0ff;
  --accent2:#ff00c8;
  --text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top left,#111 0%,#050505 60%);
  color:var(--text);
  font-family:'Orbitron',sans-serif;
  overflow-x:hidden;
  cursor:none;
}

/* Custom Cursor */
.cursor{
  width:20px;
  height:20px;
  border:2px solid var(--accent);
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  transition:0.1s ease;
  z-index:9999;
}

.cursor-glow{
  width:40px;
  height:40px;
  background:radial-gradient(circle,var(--accent),transparent);
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9998;
  opacity:0.6;
}

header{
  display:flex;
  justify-content:space-between;
  padding:25px 60px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #222;
}

header h1{
  color:var(--accent);
  letter-spacing:4px;
  font-size:24px;
}

nav a{
  margin-left:30px;
  text-decoration:none;
  color:#aaa;
  transition:0.3s;
}

nav a:hover{
  color:var(--accent2);
}

.hero{
  text-align:center;
  padding:120px 20px 80px;
}

.hero h2{
  font-size:60px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:20px;
  color:#aaa;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:40px;
  padding:60px;
}

.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  backdrop-filter:blur(20px);
}

.card:hover{
  transform:translateY(-15px) scale(1.02);
  box-shadow:0 0 30px var(--accent2);
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
}

.card-content{
  padding:25px;
}

.price{
  color:var(--accent);
  font-size:22px;
  margin:10px 0;
}

button{
  width:100%;
  padding:14px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--accent);
}

footer{
  text-align:center;
  padding:30px;
  border-top:1px solid #111;
  color:#666;
}

</style>
</head>
<body>

<div class="cursor"></div>
<div class="cursor-glow"></div>

<header>
<h1>DREZSD UP</h1>
<nav>
<a href="#">SHOP</a>
<a href="#">INFO</a>
</nav>
</header>

<section class="hero">
<h2>BATCH 001</h2>
<p>Pre-order drop. Only 10 pieces. No restock.</p>
</section>

<section class="products">

<div class="card">
<img src="images/black-tee.jpg" alt="Black Tee">
<div class="card-content">
<h3>Black // Core</h3>
<div class="price">₹999</div>
<button>Order Now</button>
</div>
</div>

<div class="card">
<img src="images/white-tee.jpg" alt="White Tee">
<div class="card-content">
<h3>White // Core</h3>
<div class="price">₹999</div>
<button>Order Now</button>
</div>
</div>

<div class="card">
<img src="images/stealth-tee.jpg" alt="Limited Tee">
<div class="card-content">
<h3>Stealth // Limited</h3>
<div class="price">₹1099</div>
<button>Order Now</button>
</div>
</div>

</section>

<footer>
© 2026 DREZSD UP — Engineered for the bold
</footer>

<script>
const cursor=document.querySelector('.cursor');
const glow=document.querySelector('.cursor-glow');

document.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
  glow.style.left=e.clientX+'px';
  glow.style.top=e.clientY+'px';
});
</script>

</body>
</html>
